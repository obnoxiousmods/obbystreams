server:
  host: 127.0.0.1
  port: 8767
  workers: 1

dashboard:
  password: "change-me"
  session_token: "change-me-to-a-long-random-token"

stream:
  command: /usr/bin/obbystreams
  encoder: auto # use gpu-only or cpu for strict dashboard toggles
  output_dir: /var/www/live.obnoxious.lol/stream
  ffmpeg_log_dir: ffmpegLogs
  scrape_urls:
    - https://icelz.to/ufc/aEWt.php
  public_dash_url: https://live.obnoxious.lol/stream/ufc.mpd
  public_hls_url: https://live.obnoxious.lol/stream/ufc.m3u8
  auto_recover: true
  auto_restart_on_exit: true
  watchdog_restart_cooldown: 20
  startup_grace_seconds: 25
  playlist_stale_seconds: 25
  min_assessment_seconds: 15
  health_sample_interval: 2
  success_score_threshold: 180
  failure_score_threshold: -120
  confirmed_failure_samples: 2
  failure_ramp_seconds: 60
  bitrate: 8M
  bitrate_720: 3500k
  maxrate_720: 4500k
  bufsize_720: 9000k
  maxrate_1080: 12M
  bufsize_1080: 24M
  audio_bitrate: 192k
  include_auto_public_sources: true
  source_manifest_path: /tmp/obbystreams-sources.json
  soursignal_auto_recover: true
  # Persisted operator "master kill switch". When true, a human hit Stop: the
  # managed ffmpeg AND both scrapers stay idle until an explicit Start/Restart.
  # Survives supervisor ticks and full restarts. Managed only by the
  # /api/stream/{start,stop,restart} endpoints — leave false here.
  operator_stopped: false
  restart_delay: 2
  max_restart_delay: 120
  rate_limit_delay: 180
  stop_after_failed_rounds: 2
  sources:
    - id: primary-hls
      label: Primary HLS
      type: hls
      url: https://example.com/primary/live.m3u8
      enabled: true
      headers: {}
    - id: sour-signal-main
      label: Sour Signal
      type: soursignal
      url: https://soursignal.com/example
      enabled: true
      headers:
        Referer: https://soursignal.com/
        User-Agent: Mozilla/5.0
  # Compatibility projection; source records are authoritative.
  links:
    - https://example.com/primary/live.m3u8
    - https://example.com/backup/live.m3u8

# Pasted public internet streams shown on fight.nswfiles.com. These are not
# ffmpeg inputs for the official managed stream; playback is proxied by
# /api/proxy-hls to avoid browser CORS failures. Add headers when a public
# source requires a browser-like Referer, Origin, or User-Agent.
public_sources:
  - id: public-example
    label: Public example
    type: public-hls
    url: https://example.com/public/live.m3u8
    enabled: false
    headers:
      Referer: https://example.com/
      User-Agent: Mozilla/5.0

# Persistent per-source blacklist. Any scraped/auto-selected or manually added
# source whose URL / id / channel / label matches an entry here is filtered out
# of every scraper cycle and every viewer-facing list, so a blocked stream can
# never reappear. Managed from the cockpit Block/Unblock buttons or the
# /api/blacklist endpoints. URL matching also ignores the query string, so a
# blocked stream stays blocked after its CDN token rotates.
source_blacklist:
  - url: https://example.com/known-bad/live.m3u8
    id: private-iptv-slate-feed
    label: Always-on slate feed
    channel: UFC 24/7
    reason: dead/slate feed
    added_at: 0

# Private official-source automation. This feeds stream.sources for the managed
# ffmpeg output only. It is separate from public_sources.
private_iptv:
  enabled: false
  provider_url: https://iptorrents.com/iptv
  playlist_url: https://tv123.me/iptv/ACCOUNT/PRIVATE_KEY/Default
  timezone: Canada/Pacific
  refresh_interval_seconds: 900
  max_candidates: 12
  min_score: 70
  probe_candidates: true
  probe_timeout_seconds: 10
  disable_stream_when_inactive: true
  connection_limit: 2
  reserve_spare_when_streaming: true
  keep_stream_live_when_inactive: true
  auto_start_when_active: true
  auto_source_prefix: private-iptv
  headers:
    Referer: https://iptorrents.com/t
    User-Agent: Mozilla/5.0
  cookies:
    uid: "change-me"
    pass: "change-me"
  keywords:
    - ufc
    - mma
    - fight night
    - prelims
    - main card
  reject_keywords:
    - no event
    - no scheduled event
    - replay
    - classic
    - 24/7
  date_window_hours: 30
  require_date_window_match: true

watcher_news:
  - id: welcome
    title: Welcome
    body: Server 1 is the official stream. Public backups are listed separately.
    tone: info
    visible: true
    pinned: true

# UFC auto-schedule. While enabled, the operator Stop becomes a *standby*: the
# cockpit arms the encode `lead_minutes` before a card's first segment (per the
# public ESPN scoreboard) and stands it back down once every bout is decided.
# See docs/auto-schedule.md.
schedule:
  enabled: true
  espn_scoreboard_url: https://site.api.espn.com/apis/site/v2/sports/mma/ufc/scoreboard
  # Which calendar rows count as a card we stream.
  include_pattern: '^UFC\s+(\d+|Fight Night)'
  exclude_pattern: 'Contender Series|Road to UFC'
  lead_minutes: 10
  # Post-fight grace before standing down, plus a hard failsafe if ESPN stalls.
  end_grace_minutes: 30
  max_runtime_hours: 8
  calendar_refresh_seconds: 3600
  live_poll_seconds: 120
  # Re-scrape until a deeply probed source matches the current segment.
  acquisition_poll_seconds: 180
  # Continue from the last validated detail through a temporary ESPN outage.
  cache_max_age_hours: 72
  display_timezone: Canada/Pacific
  state_path: /etc/obbystreams/schedule_state.json
  notify:
    enabled: false
    # A bearer credential: anyone holding it can post to your channel.
    discord_webhook_url: ""
    watcher_url: https://fight.nswfiles.com/
    warn_minutes: [1440, 720, 360, 120, 30]
    notify_card_start: true
    notify_event_end: true
    # "Coming up" announcement, posted once when a card is first tracked.
    notify_coming_up: true
    # Zones listed in that announcement's static time table. Accepts bare IANA
    # names or {zone, label} pairs; unknown zones are dropped.
    timezones:
      - zone: America/Los_Angeles
        label: Los Angeles
      - zone: America/New_York
        label: New York
      - zone: Europe/London
        label: London
      - zone: Australia/Sydney
        label: Sydney
    # Milestones older than this are dropped, not fired, so a redeploy cannot
    # spam a backlog of stale countdowns.
    max_late_minutes: 20

arangodb:
  enabled: true
  url: http://127.0.0.1:8529
  database: obbystreams
  username: obbystreams_app
  password: "change-me"
