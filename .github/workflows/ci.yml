name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --dev
      - name: Ruff
        run: uv run ruff check .
      - name: Ty (type check)
        run: uv run ty check
      - name: Compile
        run: uv run python -m py_compile app.py obbyschedule/*.py tools/bootstrap_arango.py tools/schedule_replay.py
      - name: Pytest
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Validate example YAML
        run: |
          uv run --with pyyaml python - <<'PY'
          import yaml
          with open("examples/obbystreams.example.yaml", "r", encoding="utf-8") as f:
              data = yaml.safe_load(f)
          assert data["stream"]["command"]
          assert data["arangodb"]["database"] == "obbystreams"
          # The schedule section must survive normalize_config; see docs/auto-schedule.md.
          assert data["schedule"]["lead_minutes"] > 0
          assert data["schedule"]["notify"]["discord_webhook_url"] == ""
          PY
