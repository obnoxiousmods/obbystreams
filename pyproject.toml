[project]
name = "obbystreams"
version = "0.2.1"
description = "Modern Starlette dashboard for managing resilient HLS stream transcoding."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Joey" }]
keywords = ["hls", "streaming", "starlette", "arangodb", "ffmpeg"]
dependencies = [
  "aiofiles>=25.1.0",
  "httpx>=0.28.1",
  "numpy>=2.4.6",
  "pillow>=12.3.0",
  "psutil>=7.2.2",
  "pyyaml>=6.0.3",
  "starlette>=1.0.0",
  "uvicorn[standard]>=0.44.0",
]

[project.urls]
Homepage = "https://s.obby.ca"
Repository = "https://github.com/obnoxiousmods/obbystreams"
Issues = "https://github.com/obnoxiousmods/obbystreams/issues"

[dependency-groups]
dev = [
  "ruff>=0.15.10",
  "pytest>=9.0.3",
  "ty>=0.0.61",
  "py-spy>=0.4.2",  # on-demand profiling of the live event loop
]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
# Broad, high-signal ruleset. Kept green in CI (`ruff check .`).
select = [
  "E",     # pycodestyle errors
  "F",     # pyflakes
  "I",     # isort
  "UP",    # pyupgrade
  "B",     # flake8-bugbear
  "SIM",   # flake8-simplify
  "C4",    # flake8-comprehensions
  "PIE",   # flake8-pie
  "RET",   # flake8-return
  "RUF",   # ruff-specific
  "ASYNC", # flake8-async
  "PERF",  # perflint
  "ISC",   # implicit-str-concat
  "TID",   # flake8-tidy-imports
  "FLY",   # flynt
  "G",     # flake8-logging-format
  "LOG",   # flake8-logging
  "PLE",   # pylint errors
]
ignore = [
  "E501",     # line length is handled by the formatter, not enforced
  "ASYNC109", # `timeout` params are an intentional API here; rule targets trio/anyio idioms
  "ASYNC240", # pathlib-in-async targets trio/anyio.Path; this is a plain asyncio app
]

# ty (Astral's type checker) — strict: warnings fail CI (`ty check`).
[tool.ty.environment]
python-version = "3.11"

[tool.ty.terminal]
error-on-warning = true

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = [
  "app.py",
  "obbyschedule",
  "static",
  "tools",
  "examples",
  "systemd",
  "nginx",
  "bin",
]
